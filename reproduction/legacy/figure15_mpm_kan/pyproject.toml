[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mpm-kan-figure15"
version = "1.3.0"
description = "Coupled water-seabed MPM-KAN PINN reproduction of Zhu et al. (2024) Figure 15"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.13",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.6"]

[project.scripts]
figure15-mpm-kan = "mpm_kan_figure15.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mpm_kan_figure15 = [
  "resources/*.csv",
  "resources/artifacts/*.json",
  "resources/artifacts/*.png",
  "resources/artifacts/*.csv",
  "resources/artifacts/checkpoints/*.pt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 92
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
